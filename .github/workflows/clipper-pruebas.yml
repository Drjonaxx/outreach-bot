name: Pruebas del clipper

# El clipper vive en la rama claude/clipper y lo mueven las rutinas de
# clips varias veces al dia. Este workflow corre sus pruebas todos los
# dias sobre lo ultimo de esa rama, sin tocarla: si una sesion rompe algo,
# GitHub lo marca en rojo y el briefing diario lo reporta.
# (Los horarios solo corren desde main.)
on:
  schedule:
    - cron: '17 10 * * *'   # 6:17 am en Puerto Rico, antes de la rutina de clips
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/clipper

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Instalar el clipper
        run: pip install -e ".[dev]"

      - name: Pruebas
        run: python -m pytest -q
