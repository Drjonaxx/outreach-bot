name: Pruebas del clipper

# El clipper vive en la rama claude/clipper y lo mueven las rutinas de
# clips varias veces al dia. Este workflow corre sus pruebas todos los
# dias sobre lo ultimo de esa rama, sin tocarla: si una sesion rompe algo,
# GitHub lo marca en rojo y el briefing diario lo reporta.
# (Los horarios solo corren desde main.)
on:
  schedule:
    - cron: '17 10 * * *'   # 6:17 am en Puerto Rico, antes de la rutina de clips
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/clipper

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      # El 23 oct apt se quedo colgado 18 minutos con un espejo de Ubuntu y
      # el limite del job cancelo todo sin correr una sola prueba. Cada
      # intento tiene su tope y se reintenta hasta tres veces.
      - name: Instalar ffmpeg
        timeout-minutes: 15
        run: |
          for intento in 1 2 3; do
            if timeout 90 sudo apt-get update -qq -o Acquire::Retries=3 &&
               timeout 180 sudo apt-get install -y -qq ffmpeg; then
              exit 0
            fi
            echo "::warning::apt no termino (intento $intento de 3)"
            sudo dpkg --configure -a || true
            sleep 15
          done
          exit 1

      - name: Instalar el clipper
        run: pip install -e ".[dev]"

      - name: Pruebas
        run: python -m pytest -q
