name: clipper

on:
  push:
    branches: [claude/clipper]
    paths: [job.json, "jobs/**", "clipper/**", "ci/**", .github/workflows/clipper.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clipper
  cancel-in-progress: false

jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    services:
      # PO token provider for yt-dlp (helps with YouTube's bot check on server IPs).
      pot:
        image: brainicism/bgutil-ytdlp-pot-provider
        ports: ["4416:4416"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # yt-dlp needs a JavaScript runtime for YouTube.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install clipper
        run: pip install -e . bgutil-ytdlp-pot-provider

      - name: Read job
        id: job
        run: echo "name=$(jq -r .name job.json)" >> "$GITHUB_OUTPUT"

      - name: Check out results branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin claude/clipper-out >/dev/null; then
            git clone -q --depth 1 -b claude/clipper-out "$url" results
          else
            git init -q -b claude/clipper-out results
            git -C results remote add origin "$url"
          fi
          printf '_downloads/\n_fonts/\n' > results/.gitignore

      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-models-v1

      - uses: actions/cache@v4
        with:
          path: results/_downloads
          key: video-${{ steps.job.outputs.name }}-${{ github.run_id }}
          restore-keys: video-${{ steps.job.outputs.name }}-

      - name: Run job
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then
            printf '%s' "$YT_COOKIES" > "$RUNNER_TEMP/cookies.txt"
            export YTDLP_COOKIES="$RUNNER_TEMP/cookies.txt"
          fi
          python ci/run_job.py

      - name: Publish results
        if: always()
        run: |
          cd results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Videos are only needed until they're posted: keep the current job's and those
          # rendered in the last 6 days, drop the rest (transcripts, clips.json and
          # source.json stay), then squash the branch to a single commit so old videos
          # don't pile up in history.
          python3 - "${{ steps.job.outputs.name }}" <<'EOF'
          import pathlib, sys, time
          for d in pathlib.Path(".").iterdir():
              stamp = d / "rendered_at"
              fresh = stamp.exists() and time.time() - float(stamp.read_text()) < 6 * 86400
              if d.is_dir() and d.name != ".git" and d.name != sys.argv[1] and not fresh:
                  for f in [*d.rglob("*.mp4"), *d.rglob("*.ass")]:
                      f.unlink()
          EOF
          git checkout -q --orphan squashed
          git add -A
          git commit -q -m "clipper: ${{ steps.job.outputs.name }} (run ${{ github.run_id }})"
          git push -q -f origin HEAD:claude/clipper-out
