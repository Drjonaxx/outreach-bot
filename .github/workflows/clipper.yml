name: clipper

on:
  push:
    branches: [claude/clipper]
    paths: [job.json, "jobs/**", "clipper/**", "ci/**", .github/workflows/clipper.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clipper
  cancel-in-progress: false

jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    services:
      # PO token provider for yt-dlp (helps with YouTube's bot check on server IPs).
      pot:
        image: brainicism/bgutil-ytdlp-pot-provider
        ports: ["4416:4416"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # yt-dlp needs a JavaScript runtime for YouTube.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # The runner's Azure Ubuntu mirror has crawled at a few KB/s for hours at a time, so keep the
      # downloaded .debs in the Actions cache and install from there; when they must be fetched,
      # skip the optional extras and drop Azure from the mirror list after a failed try. Fail the
      # step (instead of rendering nothing later) if ffmpeg still isn't there.
      - id: debs
        uses: actions/cache/restore@v4
        with:
          path: ~/apt-debs
          key: ffmpeg-debs-${{ runner.os }}-noble-v1

      - name: Install ffmpeg
        timeout-minutes: 40
        run: |
          mkdir -p ~/apt-debs
          sudo cp ~/apt-debs/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          apt_opts="-o Acquire::http::Timeout=30 -o Acquire::Retries=3 -o APT::Keep-Downloaded-Packages=true"
          for try in 1 2 3; do
            sudo apt-get $apt_opts update -q && sudo apt-get $apt_opts install -y -q --no-install-recommends ffmpeg && break
            echo "apt try $try failed; dropping the Azure mirror"
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt 2>/dev/null || true
            sleep 10
          done
          command -v ffmpeg && command -v ffprobe
          cp /var/cache/apt/archives/*.deb ~/apt-debs/ 2>/dev/null || true

      - if: steps.debs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/apt-debs
          key: ffmpeg-debs-${{ runner.os }}-noble-v1

      - name: Install clipper
        run: pip install -e . bgutil-ytdlp-pot-provider

      - name: Read job
        id: job
        run: echo "name=$(jq -r .name job.json)" >> "$GITHUB_OUTPUT"

      - name: Check out results branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin claude/clipper-out >/dev/null; then
            git clone -q --depth 1 -b claude/clipper-out "$url" results
          else
            git init -q -b claude/clipper-out results
            git -C results remote add origin "$url"
          fi
          printf '_downloads/\n_fonts/\n' > results/.gitignore

      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-models-v1

      - uses: actions/cache@v4
        with:
          path: results/_downloads
          key: video-${{ steps.job.outputs.name }}-${{ github.run_id }}
          restore-keys: video-${{ steps.job.outputs.name }}-

      - name: Run job
        env:
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
        run: |
          if [ -n "$YT_COOKIES" ]; then
            printf '%s' "$YT_COOKIES" > "$RUNNER_TEMP/cookies.txt"
            export YTDLP_COOKIES="$RUNNER_TEMP/cookies.txt"
          fi
          python ci/run_job.py

      - name: Publish results
        if: always()
        run: |
          cd results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Videos are only needed until they're handed over to the user (posting/queue.json
          # "delivered"): keep the current job's, drop those handed over before yesterday and
          # anything rendered over 10 days ago (transcripts, clips.json and source.json stay),
          # then squash the branch to a single commit so old videos don't pile up in history.
          python3 - "${{ steps.job.outputs.name }}" <<'EOF'
          import json, pathlib, sys, time
          from datetime import date, timedelta
          queue = pathlib.Path("../posting/queue.json")
          before = str(date.today() - timedelta(days=1))
          done = {q["id"] for q in (json.loads(queue.read_text()) if queue.exists() else [])
                  if q.get("delivered", "").startswith("20") and q["delivered"] < before}
          for d in pathlib.Path(".").iterdir():
              if not d.is_dir() or d.name in (".git", sys.argv[1]):
                  continue
              stamp = d / "rendered_at"
              fresh = stamp.exists() and time.time() - float(stamp.read_text()) < 10 * 86400
              for f in [*d.rglob("*.mp4"), *d.rglob("*.ass")]:
                  if not fresh or f"{d.name}/{f.stem.removeprefix('clip_')}" in done:
                      f.unlink()
          EOF
          git checkout -q --orphan squashed
          git add -A
          git commit -q -m "clipper: ${{ steps.job.outputs.name }} (run ${{ github.run_id }})"
          git push -q -f origin HEAD:claude/clipper-out
