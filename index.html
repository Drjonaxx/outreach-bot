<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <meta name="description" content="Análisis diario de noticias de IA generado con Claude" />

  <!-- PWA -->
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="IA Diario" />

  <title>Análisis IA Diario</title>

  <!-- Markdown renderer -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    :root {
      --bg: #0b1020;
      --bg-soft: #141a30;
      --card: #1a2240;
      --accent: #6c8cff;
      --accent-2: #b06cff;
      --text: #eef1ff;
      --muted: #9aa3c7;
      --border: #2a3358;
      --ok: #36d399;
      --err: #ff6b6b;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body { margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, #1b2347 0%, var(--bg) 55%) fixed;
      color: var(--text);
      min-height: 100vh;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 24px 18px 64px;
    }

    header.app {
      text-align: center;
      padding: 28px 0 18px;
    }

    .logo {
      width: 64px; height: 64px;
      margin: 0 auto 14px;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: grid; place-items: center;
      font-size: 32px;
      box-shadow: 0 10px 30px rgba(108,140,255,.35);
    }

    h1 {
      font-size: 24px;
      margin: 0 0 4px;
      letter-spacing: -.3px;
    }

    .subtitle { color: var(--muted); font-size: 14px; margin: 0; }

    .panel {
      background: linear-gradient(180deg, var(--card), var(--bg-soft));
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      margin-top: 22px;
      box-shadow: 0 12px 40px rgba(0,0,0,.35);
    }

    button.generate {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 16px 20px;
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      cursor: pointer;
      transition: transform .08s ease, opacity .2s ease;
      display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    button.generate:active { transform: scale(.98); }
    button.generate:disabled { opacity: .6; cursor: not-allowed; }

    .hint { color: var(--muted); font-size: 13px; text-align: center; margin: 12px 0 0; }

    /* status / spinner */
    .status {
      display: none;
      align-items: center; gap: 12px;
      margin-top: 18px;
      color: var(--muted);
      font-size: 14px;
    }
    .status.show { display: flex; }
    .spinner {
      width: 20px; height: 20px;
      border: 3px solid rgba(255,255,255,.18);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      flex: 0 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .error {
      display: none;
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 12px;
      background: rgba(255,107,107,.12);
      border: 1px solid rgba(255,107,107,.4);
      color: #ffd7d7;
      font-size: 14px;
    }
    .error.show { display: block; }

    /* report */
    .report {
      display: none;
      margin-top: 22px;
      animation: fade .4s ease;
    }
    .report.show { display: block; }
    @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    .report-meta {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; margin-bottom: 14px;
      color: var(--muted); font-size: 13px;
    }
    .copy-btn {
      background: transparent; border: 1px solid var(--border);
      color: var(--muted); border-radius: 10px;
      padding: 7px 12px; font-size: 13px; cursor: pointer;
    }
    .copy-btn:active { transform: scale(.97); }

    .md {
      background: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 18px 6px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }
    .md h1, .md h2, .md h3 { line-height: 1.25; margin: 18px 0 10px; }
    .md h1 { font-size: 22px; }
    .md h2 { font-size: 19px; }
    .md h3 { font-size: 16px; color: var(--accent); }
    .md p { margin: 0 0 12px; }
    .md ul, .md ol { margin: 0 0 12px; padding-left: 22px; }
    .md li { margin: 4px 0; }
    .md hr { border: 0; border-top: 1px solid var(--border); margin: 18px 0; }
    .md strong { color: #fff; }
    .md code {
      background: #0c1124; border: 1px solid var(--border);
      padding: 2px 6px; border-radius: 6px; font-size: 13px;
    }
    .md pre {
      background: #0c1124; border: 1px solid var(--border);
      padding: 14px; border-radius: 10px; overflow-x: auto;
    }
    .md pre code { background: transparent; border: 0; padding: 0; }
    .md table { width: 100%; border-collapse: collapse; margin: 0 0 14px; font-size: 14px; }
    .md th, .md td { border: 1px solid var(--border); padding: 8px 10px; text-align: left; }
    .md th { background: #0c1124; }
    .md blockquote {
      margin: 0 0 12px; padding: 4px 14px;
      border-left: 3px solid var(--accent);
      color: var(--muted); background: rgba(108,140,255,.06);
      border-radius: 0 8px 8px 0;
    }

    footer.app { text-align: center; color: var(--muted); font-size: 12px; margin-top: 34px; }
    footer.app a { color: var(--accent); text-decoration: none; }

    /* install banner */
    .install {
      display: none;
      margin-top: 16px;
      align-items: center; justify-content: space-between; gap: 12px;
      background: rgba(108,140,255,.1);
      border: 1px solid rgba(108,140,255,.35);
      border-radius: 12px; padding: 12px 14px; font-size: 13px;
    }
    .install.show { display: flex; }
    .install button {
      border: 0; border-radius: 9px; padding: 8px 14px;
      font-weight: 700; color: #fff; cursor: pointer;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="app">
      <div class="logo">🧠</div>
      <h1>Análisis IA Diario</h1>
      <p class="subtitle">Las noticias de IA del día, analizadas por Claude</p>
    </header>

    <div class="panel">
      <button id="generate" class="generate">
        <span id="btn-icon">⚡</span>
        <span id="btn-label">Generar análisis de hoy</span>
      </button>
      <p class="hint">Pulsa para obtener el reporte ejecutivo más reciente</p>

      <div id="status" class="status">
        <div class="spinner"></div>
        <span id="status-text">Analizando las noticias de hoy…</span>
      </div>

      <div id="error" class="error"></div>

      <div id="install" class="install">
        <span>📲 Instala esta app en tu pantalla de inicio</span>
        <button id="install-btn">Instalar</button>
      </div>
    </div>

    <div id="report" class="report">
      <div class="report-meta">
        <span id="report-date"></span>
        <button id="copy" class="copy-btn">📋 Copiar</button>
      </div>
      <div id="md" class="md"></div>
    </div>

    <footer class="app">
      Hecho con Make + Claude · <a href="https://the-decoder.com" target="_blank" rel="noopener">Fuente: The Decoder</a>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
